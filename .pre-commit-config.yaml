# Git hooks. Install once with `pre-commit install --install-hooks` (pre-commit
# and commit-msg stages). Hook repositories are pinned to commit SHAs; update
# with `pre-commit autoupdate --freeze`. Pint, Prettier and ESLint hooks join
# when the Laravel skeleton lands.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
        # TypeScript config files are JSONC (comments allowed)
        exclude: ^tsconfig(\..+)?\.json$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: \.(ps1|cmd|bat)$

  - repo: local
    hooks:
      - id: no-foreign-lockfiles
        name: reject npm and yarn lockfiles (pnpm only)
        language: fail
        entry: pnpm is the only JavaScript package manager; delete this lockfile
        files: (^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock)$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
