name: CI

# `ci-ok` is the single required check (.github/rulesets/main.json); it fails
# unless every job in `needs` succeeded (a skipped or cancelled job fails it).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      # The Oxfmt and Oxlint hooks run from node_modules.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same hooks as local commits; gitleaks runs in the security workflow.
      - run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks,pint

  php:
    name: php
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Override phpunit.xml's SQLite default: feature tests run on PostgreSQL.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: hub_test
      DB_USERNAME: hub
      DB_PASSWORD: hub
      # The queue test pushes a real job to Valkey.
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PHP 8.5, as in the project image (ADR 0002).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # Pint, Larastan and Pest with the coverage minimum.
      - run: composer check

  js:
    name: js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Wayfinder generates the typed route files (git-ignored) from Laravel,
      # so type checking and the build need PHP.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan wayfinder:generate --with-form
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # The local runtime from a fresh clone: build the project image, start
  # every Compose service and wait until all of them report healthy.
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 900
      - run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/login
      - run: docker compose exec -T app php artisan horizon:status
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  security:
    name: security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read

  ci-ok:
    name: ci-ok
    if: always()
    needs: [hygiene, php, js, compose, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
