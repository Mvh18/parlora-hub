# Dependabot version updates. Security updates are not delayed by the
# cooldown; version updates wait seven days so a compromised release is
# usually caught before it is proposed here. The docker and docker-compose
# ecosystems join with the Dockerfile and compose.yaml (#10): Dependabot
# errors on a directory without a manifest.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer-dev:
        dependency-type: development
      composer:
        dependency-type: production
        update-types: [minor, patch]

  # pnpm-lock.yaml is handled by the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dev:
        dependency-type: development
      npm:
        dependency-type: production
        update-types: [minor, patch]
