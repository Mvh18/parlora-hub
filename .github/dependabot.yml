# Dependabot version updates. Security updates are not delayed by the
# cooldown; version updates wait seven days so a compromised release is
# usually caught before it is proposed here.
#
# The explicit lowercase prefix makes Dependabot write "build(deps): bump ..."
# instead of "Bump ...", which the PR title check rejects.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      composer-dev:
        dependency-type: development
      composer:
        dependency-type: production
        update-types: [minor, patch]

  # pnpm-lock.yaml is handled by the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-dev:
        dependency-type: development
      npm:
        dependency-type: production
        update-types: [minor, patch]

  # Base images in the Dockerfile and service images in compose.yaml, all
  # pinned to digests.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-compose:
        patterns: ["*"]
